@let t = i18n.t();

<div class="settings">
  <!-- Appearance Section -->
  <section class="settings__section">
    <h3 class="settings__label">{{ t.themeLabel }}</h3>
    <div class="settings__group settings__group--stack" role="radiogroup" [attr.aria-label]="t.themeLabel">
      @for (th of themes(); track th.id) {
        <button
          type="button"
          class="settings__option"
          [class.settings__option--active]="themePref.pref() === th.id"
          role="radio"
          [attr.aria-checked]="themePref.pref() === th.id"
          (click)="selectTheme(th.id)">
          <span class="settings__badge settings__badge--icon" aria-hidden="true">
            <lucide-icon [img]="th.icon" [size]="13"></lucide-icon>
          </span>
          <span class="settings__name">{{ th.label }}</span>
        </button>
      }
    </div>
  </section>

  <!-- Language Section -->
  <section class="settings__section">
    <h3 class="settings__label">{{ t.changeLanguage }}</h3>
    <div class="settings__group" role="radiogroup" [attr.aria-label]="t.changeLanguage">
      @for (l of languages; track l.id) {
        <button
          type="button"
          class="settings__option"
          [class.settings__option--active]="i18n.lang() === l.id"
          role="radio"
          [attr.aria-checked]="i18n.lang() === l.id"
          (click)="selectLang(l.id)">
          <span class="settings__badge" translate="no">{{ l.id.toUpperCase() }}</span>
          <span class="settings__name">{{ l.label }}</span>
        </button>
      }
    </div>
  </section>

  <!-- Date Format Section -->
  <section class="settings__section">
    <h3 class="settings__label">{{ t.dateFormatLabel }}</h3>
    <div class="settings__group settings__group--stack" role="radiogroup" [attr.aria-label]="t.dateFormatLabel">
      @for (f of dateFormats(); track f.id) {
        <button
          type="button"
          class="settings__option"
          [class.settings__option--active]="i18n.dateFormatPref() === f.id"
          role="radio"
          [attr.aria-checked]="i18n.dateFormatPref() === f.id"
          (click)="selectDateFormat(f.id)">
          <span class="settings__badge" translate="no">{{ f.badge }}</span>
          <span class="settings__name">{{ f.label }}</span>
        </button>
      }
    </div>
  </section>

  <!-- Area Units Section -->
  <section class="settings__section">
    <h3 class="settings__label">{{ t.areaUnitLabel }}</h3>
    <div class="settings__group settings__group--stack" role="radiogroup" [attr.aria-label]="t.areaUnitLabel">
      @for (u of areaUnits(); track u.id) {
        <button
          type="button"
          class="settings__option"
          [class.settings__option--active]="i18n.areaUnitPref() === u.id"
          role="radio"
          [attr.aria-checked]="i18n.areaUnitPref() === u.id"
          (click)="selectAreaUnit(u.id)">
          <span class="settings__badge" translate="no">{{ u.badge }}</span>
          <span class="settings__name">{{ u.label }}</span>
        </button>
      }
    </div>
  </section>
</div>
