services:
  # ----------------------------------------------------------------------------
  # Interactive Dev Shell: Full environment for commands, tests, and AI tools
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    stdin_open: true
    tty: true
    ports:
      - "${PORT:-4200}:4200"
      - "9876:9876"
    volumes:
      # Mount codebase
      - .:/workspace
      # Keep container Linux node_modules isolated from host OS
      - node_modules:/workspace/node_modules
      # Persist command line history
      - command_history:/commandhistory
      # Persist AI CLI configuration & credentials
      - agy_config:/home/node/.gemini
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHROME_BIN=/usr/bin/chromium

  # ----------------------------------------------------------------------------
  # Dev Server: Live-reloading Angular development server
  # ----------------------------------------------------------------------------
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-4200}:4200"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # ----------------------------------------------------------------------------
  # Production: Production build served via high-performance Nginx
  # ----------------------------------------------------------------------------
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${PROD_PORT:-8080}:80"

volumes:
  node_modules:
  dev_node_modules:
  command_history:
  agy_config:
